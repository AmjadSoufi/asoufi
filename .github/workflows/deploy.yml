name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN scopes required to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a production deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      # The committed build output is what "Deploy from a branch" would serve
      # and what local dev/tests load, so it must not drift from source.
      - name: Verify committed build output is up to date
        run: |
          if ! git diff --exit-code -- static/redesign/dist static/css/redesign.min.css; then
            echo "::error::Committed build output is out of date with source. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests before publishing
        run: npm test

      # Keep the dependency tree and test reports out of the published artifact.
      - name: Remove dev dependencies before publishing
        run: rm -rf node_modules playwright-report test-results

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
